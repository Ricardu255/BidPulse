# 生产 profile：只放「安全默认值」，不放任何真实凭据。
# 启动前必须显式提供 BIDPULSE_AUTH_SECRET、BIDPULSE_DB_PASSWORD 与各账号密码，
# 缺失时 ProductionConfigGuard 会让应用启动失败。
management:
  endpoint:
    health:
      # 匿名探针只看 status；DB/Redis/Kafka 细节仅 ADMIN 可见。
      # show-details=when-authorized 在 roles 为空时退化成「任何已认证用户」，
      # 而 /actuator/health 是 permitAll，VIEWER/OPERATOR 也能看到组件详情，
      # 所以必须显式声明 roles。比较的是 "ROLE_" + role，与 Role.authority() 对齐。
      show-details: when-authorized
      roles: ADMIN
  endpoints:
    web:
      exposure:
        # 生产默认不暴露 metrics/prometheus；需要采集时显式覆盖
        include: health,info
