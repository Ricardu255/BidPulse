name: CI

# 触发时机：任意分支 push / 开 PR / 手动触发
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# 最小权限：CI 只需要读仓库。即使某个第三方 action 被投毒，也拿不到写权限。
permissions:
  contents: read

# 同一分支连续推送时取消旧构建：PR 只看最新一次结果，也节省 runner 时间。
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest          # 自带 Docker，支持 services
    timeout-minutes: 30
    # 与生产/本机一致：预算日 key、频次小时 key、概览今日窗口都按东八区切分。
    # 同时让所有集成测试在非 UTC 的时区下跑一遍，避免只在开发者本机通过。
    #
    # 集成测试全部指向独立资源：
    #   · MySQL 库名 bidpulse_it（IntegrationTestGuard + 实际连接元数据双重校验）
    #   · Redis database 1（不碰 demo 的 0 号库）
    #   · Kafka 主题 bidpulse_it_*（不消费 demo/生产主题）
    env:
      TZ: Asia/Shanghai
      BIDPULSE_IT: "true"
      BIDPULSE_JDBC_URL: "jdbc:mysql://127.0.0.1:3306/bidpulse_it?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&rewriteBatchedStatements=true"
      BIDPULSE_DB_USERNAME: root
      BIDPULSE_DB_PASSWORD: ""
      BIDPULSE_REDIS_HOST: 127.0.0.1
      BIDPULSE_REDIS_PORT: "6379"
      BIDPULSE_REDIS_DATABASE: "1"
      BIDPULSE_KAFKA_BOOTSTRAP: 127.0.0.1:9092
      BIDPULSE_KAFKA_TOPIC: bidpulse_it_bid_event
      BIDPULSE_KAFKA_DLT_TOPIC: bidpulse_it_bid_event.DLT

    services:
      # —— MySQL：独立 bidpulse_it 库，与 demo 库完全隔离 ——
      mysql:
        image: mysql:8
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: bidpulse_it
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

      # —— Redis ——
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

      # —— Kafka（KRaft 单节点，与 docker-compose 的 bidpulse-kafka 一致）——
      # ADVERTISED_LISTENERS 必须为 localhost：否则宿主侧测试 JVM 拿到容器内部主机名，
      # 连不上（经典报错 Connection to node -1 could not be established）。
      kafka:
        image: apache/kafka:3.7.0
        env:
          CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
          KAFKA_NODE_ID: "1"
          KAFKA_PROCESS_ROLES: "broker,controller"
          KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
          KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://localhost:9092"
          KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
          KAFKA_CONTROLLER_QUORUM_VOTERS: "1@localhost:9093"
          KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
          # 单节点：副本/ISR 必须为 1，否则建 topic / 写会失败
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
          KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
        ports:
          - 9092:9092
        options: >-
          --health-cmd="/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"
          --health-interval=15s
          --health-timeout=10s
          --health-retries=10
          --health-start-period=30s

    steps:
      # 所有 action 固定到 commit SHA（注释为对应版本），防止 tag 被移动导致供应链投毒。
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # 需要 HEAD^ 做 diff 检查；默认 depth=1 时父提交不存在
          fetch-depth: 2

      - name: Check whitespace errors
        # 检查本次提交是否引入行尾空格 / 空格缩进等空白问题
        run: git diff --check HEAD^ HEAD

      - name: Scan for secrets
        run: bash tools/check-secrets.sh

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"
          cache: maven            # 缓存 ~/.m2，加速依赖下载

      - name: Install MySQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y default-mysql-client

      - name: Init integration-test database
        # 建 bidpulse_it 库 → baseline → 全部迁移（迁移必须幂等，否则这里会失败）
        run: bash tools/init-it-db.sh

      - name: Verify test timezone
        # 防止 runner 或镜像悄悄退回 UTC；+0800 才继续往下跑。
        run: test "$(date +%z)" = "+0800" && date

      - name: Run tests and package
        # verify 比 test 多走 package：确认可执行 jar 能构建出来，作为发布门禁。
        # -Pfull-tests：CI 有 services，跑全量（含 @Tag("integration")）。
        run: mvn -B -ntp verify -Pfull-tests

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: surefire-reports
          path: target/surefire-reports/
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload coverage report
        # 覆盖率门禁失败时最需要看报告；无论成败都上传。
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: jacoco-report
          path: target/site/jacoco/
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload SpotBugs report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: spotbugs-report
          path: target/spotbugsXml.xml
          retention-days: 7
          if-no-files-found: ignore

      - name: Smoke test /actuator/health
        # 打包产物在真实中间件上启动，健康检查 UP 才算通过。
        run: |
          set -euo pipefail
          java -jar target/bidpulse-engine-*.jar > app.log 2>&1 &
          APP_PID=$!
          trap 'kill "$APP_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:8080/actuator/health | grep -q '"status":"UP"'; then
              echo "health UP after ${i} attempts"
              exit 0
            fi
            sleep 2
          done
          echo "应用未在 180s 内健康启动，最近日志："
          tail -n 200 app.log
          exit 1

  console-ui:
    name: console-ui
    # 前后端分离：前端独立构建，不复用后端 job
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: console-ui
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: console-ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check and build
        run: npm run build

      - name: Unit tests
        run: npm test

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: E2E tests (mock)
        run: npm run test:e2e

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-traces
          path: console-ui/test-results/
          retention-days: 7
          if-no-files-found: ignore

  console-e2e-live:
    # 真实链路冒烟：前端 Vite → 真实后端 → MySQL / Redis / Kafka。
    # mock E2E 只能证明页面在假数据下能渲染；这里证明登录、代理、鉴权、
    # 竞价链路和演示种子数据在 CI 里确实能串起来。
    #
    # 只跑 3 条稳定用例（概览、竞价、审计），全量真实后端 E2E 仍由本地/发布前手动执行。
    name: console-e2e-live
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Asia/Shanghai
      BIDPULSE_JDBC_URL: "jdbc:mysql://127.0.0.1:3306/bidpulse_e2e?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&rewriteBatchedStatements=true"
      BIDPULSE_DB_USERNAME: root
      BIDPULSE_DB_PASSWORD: ""
      BIDPULSE_REDIS_HOST: 127.0.0.1
      BIDPULSE_REDIS_PORT: "6379"
      # 与集成测试（DB 1）、demo（DB 0）都隔离
      BIDPULSE_REDIS_DATABASE: "2"
      BIDPULSE_KAFKA_BOOTSTRAP: 127.0.0.1:9092
      BIDPULSE_KAFKA_TOPIC: bidpulse_e2e_bid_event
      BIDPULSE_KAFKA_DLT_TOPIC: bidpulse_e2e_bid_event.DLT
      # 仅用于 CI 的临时凭据，不是仓库里的真实密钥
      BIDPULSE_AUTH_SECRET: ci-e2e-auth-secret-not-for-production
      BIDPULSE_ADMIN_PASSWORD: ci-e2e-admin-password
      E2E_USERNAME: admin
      E2E_PASSWORD: ci-e2e-admin-password
      E2E_BASE_URL: http://127.0.0.1:5173

    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: bidpulse_e2e
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

      kafka:
        image: apache/kafka:3.7.0
        env:
          CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
          KAFKA_NODE_ID: "1"
          KAFKA_PROCESS_ROLES: "broker,controller"
          KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
          KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://localhost:9092"
          KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
          KAFKA_CONTROLLER_QUORUM_VOTERS: "1@localhost:9093"
          KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
          KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
        ports:
          - 9092:9092
        options: >-
          --health-cmd="/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"
          --health-interval=15s
          --health-timeout=10s
          --health-retries=10
          --health-start-period=30s

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Install MySQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y default-mysql-client

      - name: Init e2e database with demo seed
        run: |
          set -euo pipefail
          MYSQL=(mysql -h127.0.0.1 -P3306 -uroot --default-character-set=utf8mb4)
          "${MYSQL[@]}" -e "CREATE DATABASE IF NOT EXISTS bidpulse_e2e DEFAULT CHARACTER SET utf8mb4"
          "${MYSQL[@]}" bidpulse_e2e < sql/all-schema.sql
          for f in sql/migrations/*.sql; do
            "${MYSQL[@]}" bidpulse_e2e < "$f"
          done
          # seed-demo.sql 顶部写死了 USE bidpulse；这里去掉后显式指定 e2e 库。
          sed '/^USE /d' sql/seed-demo.sql | "${MYSQL[@]}" bidpulse_e2e

      - name: Build application jar
        run: mvn -B -ntp package -DskipTests

      - name: Start backend and wait for health
        run: |
          set -euo pipefail
          java -jar target/bidpulse-engine-*.jar > app.log 2>&1 &
          echo $! > app.pid
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:8080/actuator/health | grep -q '"status":"UP"'; then
              echo "backend UP after ${i} attempts"
              exit 0
            fi
            sleep 2
          done
          echo "后端未在 180s 内健康启动，最近日志："
          tail -n 200 app.log
          exit 1

      - name: Set up Node 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: console-ui/package-lock.json

      - name: Install console dependencies
        working-directory: console-ui
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: console-ui
        run: npx playwright install --with-deps chromium

      - name: Start Vite dev server
        working-directory: console-ui
        run: |
          set -euo pipefail
          npm run dev -- --host 127.0.0.1 --port 5173 > vite.log 2>&1 &
          echo $! > vite.pid
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:5173/ >/dev/null; then
              echo "vite UP after ${i} attempts"
              exit 0
            fi
            sleep 1
          done
          echo "Vite 未在 60s 内启动："
          cat vite.log
          exit 1

      - name: Real-backend E2E smoke
        working-directory: console-ui
        run: |
          npx playwright test \
            --grep "overview renders KPI|playground runs a bid|admin can open audit log"

      - name: Upload live E2E logs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: live-e2e-logs
          path: |
            app.log
            console-ui/vite.log
            console-ui/test-results/
          retention-days: 7
          if-no-files-found: ignore

      - name: Stop background processes
        if: always()
        run: |
          kill "$(cat app.pid)" 2>/dev/null || true
          kill "$(cat console-ui/vite.pid)" 2>/dev/null || true

  release-gate:
    # 单一稳定门禁：分支保护只需要勾选这一个 check。
    # 后端、前端、真实链路任一失败，本 job 都不会执行，整体状态即失败。
    name: release-gate
    needs: [backend, console-ui, console-e2e-live]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: All required jobs passed
        run: echo "backend + console-ui passed; ready to merge/release."
